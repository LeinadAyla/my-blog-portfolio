{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card bg-light mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-clock"></i> Status do Sistema</h5>
                    <p class="card-text">Data e hora atual: <strong>{{ data["now"].strftime('%d/%m/%Y %H:%M:%S') }}</strong></p>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Cores Disponíveis para o Banner</h5>
                </div>
                <ul class="list-group list-group-flush">
                    {% for color in data["banner_colors"] %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ color }}
                        <span class="badge rounded-pill" style="background-color: {{ color }}; border: 1px solid #ccc;">&nbsp;&nbsp;&nbsp;</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>

            <button class="btn btn-outline-primary shadow-sm" onclick="location.reload();">
                <i class="bi bi-arrow-clockwise"></i> Atualizar Cores
            </button>
        </div>
    </div>
</div>
{% endblock %}
