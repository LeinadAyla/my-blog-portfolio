{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h3 class="mb-0"><i class="bi bi-lock-fill"></i> Acesso Restrito</h3>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">Identifique-se para gerenciar o blog.</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha de Comandante</label>
                        <input type="password" name="senha" class="form-control form-control-lg text-center" id="senha" placeholder="Digite a senha..." required autofocus>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar no Painel</button>
                        <a href="{{ url_for('blog_bp.lista_posts') }}" class="btn btn-link text-secondary">Voltar ao Blog</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-light">
                <small class="text-muted">Engenharia, SELVA!! 🗣️</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
