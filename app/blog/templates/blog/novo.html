{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white">
                <h2 class="mb-0 h4"><i class="bi bi-pencil-square"></i> Escrever Novo Post</h2>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="titulo" class="form-label font-weight-bold">Título do Post</label>
                        <input type="text" name="titulo" class="form-control form-control-lg" id="titulo" placeholder="Ex: Minha primeira postagem oficial" required>
                    </div>
                    <div class="mb-3">
                        <label for="conteudo" class="form-label font-weight-bold">Conteúdo da Postagem</label>
                        <textarea name="conteudo" class="form-control" id="conteudo" rows="6" placeholder="Compartilhe o que você aprendeu hoje..." required></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Publicar no Blog</button>
                        <a href="{{ url_for('blog_bp.lista_posts') }}" class="btn btn-outline-secondary">
                            Cancelar e Voltar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
